name: Build APK
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: venga-dashboard-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publier l'APK dans Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk \
            --title "Venga Dashboard v${{ github.run_number }}" \
            --notes "APK à installer directement : app-debug.apk"
